name: Desplegar en Cloudflare Pages

# Cada push a main que toque la PWA la publica en https://kotodex.pages.dev.
# Lo de server/ no pasa por aquí: el servidor corre en el portátil y se reinicia a mano.
on:
  push:
    branches: [main]
    paths-ignore:
      - "server/**"
      - "**.md"
  workflow_dispatch:

# Un despliegue a la vez; si llegan dos pushes seguidos, el segundo espera al primero.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Comprobar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Las comprobaciones son la puerta: si fallan, no se publica.
      - name: Tipos
        run: npx tsc -p .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Mismo comando que en COMANDOS.md. --branch main lo marca como producción, así que sale en
      # la URL fija y no en una de vista previa.
      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name kotodex --branch main
